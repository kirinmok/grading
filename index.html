<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111111">
<title>學生表現計分</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#111; --card:#1c1c1e; --card2:#2c2c2e; --fg:#fff; --dim:#8e8e93;
  --gold:#ffc531; --green:#30d158; --red:#ff453a; --blue:#0a84ff;
  --pad:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
  overscroll-behavior:none;
  height:100dvh;display:flex;flex-direction:column;
}
button{font-family:inherit;color:inherit;border:0;background:none;font-size:1rem}
.hide{display:none!important}

/* ---------- top bar ---------- */
header{
  flex:none;z-index:20;background:rgba(17,17,17,.92);
  backdrop-filter:blur(12px);padding:8px 10px 6px;
  display:flex;gap:8px;align-items:center;
}
#pick{
  flex:1;display:flex;gap:6px;align-items:center;justify-content:center;
  background:var(--card);border-radius:12px;padding:10px 8px;font-weight:700;font-size:17px;
  white-space:nowrap;overflow:hidden;min-width:0;
}
#pick #pickLabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pick small{color:var(--dim);font-weight:500;font-size:12px;margin-left:4px}
.iconbtn{background:var(--card);border-radius:12px;width:44px;height:44px;font-size:19px}

/* ---------- grid ---------- */
#grid{
  flex:1;min-height:0;
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 10px 6px;
}
.stu{
  background:var(--card);border-radius:14px;padding:4px 3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:0;position:relative;transition:transform .06s;overflow:hidden;
  border:2px solid transparent;
}
.stu:active{transform:scale(.94)}
.stu .no{font-size:12px;color:var(--dim);font-weight:600;line-height:1}
.stu .nm{font-size:12px;font-weight:600;line-height:1.1;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu .sc{font-size:clamp(20px,4.2vh,34px);font-weight:800;color:var(--gold);line-height:1.1}
.stu .sc.zero{color:#48484a}
.stu .today{
  position:absolute;top:5px;right:6px;background:var(--green);color:#000;
  font-size:11px;font-weight:800;border-radius:9px;padding:1px 5px;line-height:1.35;
}
.stu.g{border-color:var(--blue)}
.stu .gp{position:absolute;top:5px;left:6px;font-size:11px;color:var(--blue);font-weight:800}
.stu.sel{border-color:var(--green);background:#1e3a24}
.stu.sel .no{color:var(--green)}
#bottom.grouping button{background:var(--card2)}
#bottom.grouping button.set{background:var(--green);color:#000}

/* group row */
#groups{flex:none;display:flex;gap:6px;overflow-x:auto;padding:0 10px 4px;scrollbar-width:none}
#groups:empty{display:none}
#groups::-webkit-scrollbar{display:none}
#groups button{
  background:var(--card2);border-radius:11px;padding:7px 14px;font-size:14px;
  font-weight:700;white-space:nowrap;flex:none
}
#groups button.on{background:var(--blue)}

/* ---------- bottom bar ---------- */
#bottom{
  flex:none;z-index:20;
  background:rgba(17,17,17,.94);backdrop-filter:blur(12px);
  padding:6px 10px calc(6px + var(--pad));display:flex;gap:8px;
  border-top:1px solid #2c2c2e;
}
#bottom button{flex:1;background:var(--card);border-radius:13px;padding:10px 4px;font-size:14px;font-weight:700}
#bottom button.pri{background:var(--blue)}

/* ---------- sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);
  display:flex;align-items:flex-end;
}
.sheet>div{
  background:#1c1c1e;width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:14px 14px calc(20px + var(--pad));
  animation:up .18s ease-out;
}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:2px 0 12px;font-size:19px;text-align:center}
.sheet h3 span{color:var(--dim);font-size:14px;font-weight:500;display:block;margin-top:3px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.items button{
  background:var(--card2);border-radius:15px;padding:15px 8px;font-size:16px;font-weight:700;
  display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;
}
.items button small{color:var(--dim);font-size:11px;font-weight:600}
.items button.neg{background:#3a2020}
.items button.neg small{color:#ff9f9a}
.closebar{margin-top:12px;display:flex;gap:8px}
.closebar button{flex:1;background:var(--card2);border-radius:13px;padding:13px;font-weight:700}

/* list rows */
.row{display:flex;gap:10px;align-items:center;background:var(--card2);
  border-radius:12px;padding:11px 12px;margin-bottom:7px;font-size:15px}
.row b{flex:1;font-weight:600}
.row .x{color:var(--red);font-weight:800;padding:0 6px}
.row .tag{font-size:11px;color:var(--dim);background:#3a3a3c;border-radius:6px;padding:2px 6px}
input,select,textarea{
  background:#3a3a3c;border:0;border-radius:10px;color:#fff;padding:11px;font-size:16px;
  width:100%;font-family:inherit
}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px;font-weight:600}
.btn{background:var(--blue);border-radius:13px;padding:13px;font-weight:700;width:100%;margin-top:12px}
.btn.gray{background:var(--card2)}
.btn.danger{background:#3a2020;color:#ff9f9a}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:left;border-bottom:1px solid #2c2c2e}
th{color:var(--dim);font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(84px + var(--pad));transform:translateX(-50%);
  background:rgba(48,209,88,.95);color:#000;font-weight:800;padding:10px 18px;
  border-radius:20px;z-index:80;opacity:0;transition:opacity .18s;pointer-events:none;
  font-size:15px;white-space:nowrap
}
#toast.on{opacity:1}
#toast.bad{background:rgba(255,69,58,.95);color:#fff}
.empty{color:var(--dim);text-align:center;padding:40px 20px;font-size:15px;line-height:1.7}
</style>
</head>
<body>

<header>
  <button class="iconbtn" id="btnSetup">⚙️</button>
  <button id="pick"><span id="pickLabel">—</span></button>
  <button class="iconbtn" id="btnUndo">↩︎</button>
</header>

<div id="groups"></div>
<div id="grid"></div>

<div id="bottom">
  <button id="btnBoard">🏆 本節</button>
  <button id="btnMode" class="pri">👥 整組</button>
  <button id="btnCalc">📊 成績</button>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   學生表現計分工具 — 本機優先版
   資料全部存在這台裝置的 localStorage，不上傳任何伺服器。
   ========================================================= */
const VERSION='1.7.1';
const BUILT='2026-08-30';
let CLOUD_VERSION=null;
/* 雲端只有在 Apps Script 真的改過時才需要重新部署，
   所以不比對「相等」，只檢查雲端有沒有舊到不支援目前的功能 */
const CLOUD_MIN='1.6';
const verLT=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);
  for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d<0}
  return false;};
const LS='gradeapp.v1';
const TAGS={
  regular:{name:'平常成績',color:'#30d158'},
  work:{name:'作品',color:'#ffc531'},
  report:{name:'學習單/報告',color:'#0a84ff'},
  reflect:{name:'心得省思',color:'#bf5af2'}
};
/* 每個課程可以自己命名這四格（社團的四項跟正課不一樣） */
function tagName(k,c){return (c||course())?.tagNames?.[k]||TAGS[k].name;}

/* ---------------- 闖關任務 ----------------
   狀態色經 CVD 驗證：綠/藍/紅在紅綠色盲下仍可分辨，且一律附文字，不靠顏色分辨 */
const ST={
  none:  {t:'未交',   c:'#ff453a', i:'⚠️'},
  sub:   {t:'待核准', c:'#0a84ff', i:'⏳'},
  pass:  {t:'通過',   c:'#30d158', i:'✅'},
  revise:{t:'待補件', c:'#ff9f0a', i:'✏️'},
  lock:  {t:'未開放', c:'#48484a', i:'🔒'}
};

/* 無人機 13 堂（902/903）。901/904 的 16 堂另表，之後再補 */
function droneMissions(){
  return [
    {id:'M01',seq:1, title:'任務預告與分組',      gate:'',  scope:'group', note:'不計分'},
    {id:'M02',seq:2, title:'七組拼圖情報任務',    gate:'',  scope:'group', note:'一頁報告＋2來源'},
    {id:'M03',seq:3, title:'拼圖發表',            gate:'A', scope:'group', note:'A 情報通行證'},
    {id:'M04',seq:4, title:'系統圖與機架配置',    gate:'',  scope:'group', note:'故障排查路徑'},
    {id:'M05',seq:5, title:'子系統實驗',          gate:'',  scope:'group', note:'預測—實測表'},
    {id:'M06',seq:6, title:'電池電表與焊接資格',  gate:'B', scope:'person',note:'B 個人焊接資格'},
    {id:'M07',seq:7, title:'盤點與第一批焊接',    gate:'',  scope:'group', note:'板未到走分流'},
    {id:'M08',seq:8, title:'指定焊接與機構組裝',  gate:'C', scope:'group', note:'C 上電卡'},
    {id:'M09',seq:9, title:'Pico 啟動與 IMU',     gate:'',  scope:'group', note:'需 C 卡'},
    {id:'M10',seq:10,title:'無槳四馬達與急停',    gate:'',  scope:'group', note:'電子最低完成線'},
    {id:'M11',seq:11,title:'整機與受限測試',      gate:'D', scope:'group', note:'D 測試卡'},
    {id:'M12',seq:12,title:'除錯與單一變因優化',  gate:'',  scope:'group', note:'三次測試證據'},
    {id:'M13',seq:13,title:'最終驗收與個人省思',  gate:'',  scope:'person',note:'E 成果省思'}
  ];
}

function defaultItems(){
  return [
    {id:id(),icon:'🙋',name:'發言',tag:'regular',v:1,group:false},
    {id:id(),icon:'🤝',name:'協作',tag:'regular',v:1,group:false},
    {id:id(),icon:'🔧',name:'實作進度',tag:'work',v:1,group:false},
    {id:id(),icon:'🎯',name:'實測達標',tag:'work',v:1,group:false},
    {id:id(),icon:'📄',name:'學習單',tag:'report',v:1,group:false},
    {id:id(),icon:'💭',name:'反思',tag:'reflect',v:1,group:false},
    {id:id(),icon:'📦',name:'器材歸位',tag:'regular',v:1,group:true},
    {id:id(),icon:'⚠️',name:'未整理',tag:'regular',v:-1,group:true}
  ];
}
function id(){return Math.random().toString(36).slice(2,9)}

const DEFAULT={
  courses:[
    {id:'c1',name:'水陸兩用車',icon:'🚗',classes:['801','802','803','804'],items:defaultItems()},
    {id:'c2',name:'無人機',icon:'🚁',classes:['901','902','903','904'],items:defaultItems()},
    {id:'c3',name:'AI 科技',icon:'🤖',classes:['901','902'],items:defaultItems()}
  ],
  rosters:{},          // "901" -> [{no,name,group}]
  records:[],          // {t,course,cls,no,item,name,tag,v,session}
  cur:{course:'c1',cls:'801'},
  size:20
};

let D=load();
function load(){
  try{
    const r=JSON.parse(localStorage.getItem(LS));
    if(r&&r.courses)return migrate(r);
  }catch(e){}
  return structuredClone(DEFAULT);
}
/* v1.4：分組從「學生身上」搬到「課程×班級」。
   舊資料只有一套分組，搬到該班第一個有記錄的課程，其餘課程留空。 */
function migrate(r){
  if(r.groupsMigrated)return r;
  r.groups=r.groups||{};
  Object.entries(r.rosters||{}).forEach(([cls,list])=>{
    const has=list.some(x=>x.group);
    if(!has)return;
    const owner=(r.courses.find(c=>(c.classes||[]).includes(cls)&&
        (r.records||[]).some(x=>x.course===c.id&&x.cls===cls))
      ||r.courses.find(c=>(c.classes||[]).includes(cls)));
    if(!owner)return;
    r.groups[owner.id]=r.groups[owner.id]||{};
    const m=r.groups[owner.id][cls]={};
    list.forEach(x=>{if(x.group)m[x.no]=x.group});
  });
  r.groupsMigrated=1;
  return r;
}
function save(){localStorage.setItem(LS,JSON.stringify(D))}

const $=s=>document.querySelector(s);
const course=()=>D.courses.find(c=>c.id===D.cur.course)||D.courses[0];
function roster(cls){
  if(!D.rosters[cls]){
    D.rosters[cls]=Array.from({length:D.size},(_,i)=>({no:i+1,name:'',group:0}));
  }
  return D.rosters[cls];
}
/* 本節 = 同一天 + 同課程 + 同班 */
function sessionKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}|${D.cur.course}|${D.cur.cls}`;
}
function recs(){return D.records.filter(r=>r.course===D.cur.course&&r.cls===D.cur.cls)}
function total(no){return recs().filter(r=>r.no===no).reduce((s,r)=>s+r.v,0)}
function todayCount(no){const k=sessionKey();return recs().filter(r=>r.no===no&&r.session===k).reduce((s,r)=>s+r.v,0)}

function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
let tt;
function toast(msg,bad){
  const t=$('#toast');t.textContent=msg;t.className='on'+(bad?' bad':'');
  clearTimeout(tt);tt=setTimeout(()=>t.className='',1100);
}

/* ---------------- render ---------------- */
let groupFilter=null;
let grouping=false;              // 快速分組模式
const sel=new Set();             // 分組模式下已選的座號

/* 分組跟著「課程×班級」走：同一個班在不同課程可以有各自的分組 */
function gmap(cid,cls){
  D.groups=D.groups||{};
  const c=cid||D.cur.course, k=cls||D.cur.cls;
  D.groups[c]=D.groups[c]||{};
  D.groups[c][k]=D.groups[c][k]||{};
  return D.groups[c][k];
}
function gOf(no){return gmap()[no]||0}
function setG(no,g){const m=gmap();if(g)m[no]=g;else delete m[no];}

function nextGroupNo(){
  const used=new Set(Object.values(gmap()).filter(Boolean));
  let n=1;while(used.has(n))n++;return n;
}
function enterGrouping(){grouping=true;sel.clear();render();
  toast(`分「${course().name}」的組，不影響其他課`);}
function exitGrouping(){grouping=false;sel.clear();render();}
function assignGroup(){
  if(!sel.size){toast('先點幾個人',1);return}
  const g=nextGroupNo();
  sel.forEach(no=>setG(no,g));
  sel.clear();buzz(22);save();render();toast(`已設為第 ${g} 組`);
}
function clearGroups(){
  if(!confirm(`清除 ${D.cur.cls} 的所有分組？計分記錄不受影響。`))return;
  D.groups[D.cur.course][D.cur.cls]={};
  sel.clear();groupFilter=null;save();render();toast('分組已清除',1);
}

function render(){
  const c=course();
  if(!c.classes.includes(D.cur.cls))D.cur.cls=c.classes[0];
  $('#pickLabel').innerHTML = grouping
    ? `✕ 分組中 <small>點此離開</small>`
    : `${c.icon} ${c.name} ${D.cur.cls} <small>點此換班</small>`;

  const r=roster(D.cur.cls);
  const gs=[...new Set(Object.values(gmap()).filter(Boolean))].sort((a,b)=>a-b);
  const gw=$('#groups');
  gw.innerHTML='';
  if(gs.length){
    const all=document.createElement('button');
    all.textContent='全部';
    if(groupFilter===null)all.className='on';
    all.onclick=()=>{groupFilter=null;render()};
    gw.appendChild(all);
    gs.forEach(g=>{
      const b=document.createElement('button');
      b.textContent='第'+g+'組';
      if(groupFilter===g)b.className='on';
      b.onclick=()=>{groupFilter=(groupFilter===g?null:g);render();};
      gw.appendChild(b);
    });
  }

  const grid=$('#grid');grid.innerHTML='';
  grid.style.gridTemplateRows=`repeat(${Math.ceil(r.length/4)},1fr)`;
  r.forEach(s=>{
    const el=document.createElement('button');
    el.className='stu'+(grouping&&sel.has(s.no)?' sel':'')
      +(!grouping&&groupFilter&&gOf(s.no)===groupFilter?' g':'');
    const t=total(s.no),td=todayCount(s.no);
    el.innerHTML=
      (s.from?`<div class="gp" style="color:var(--dim)">${s.from}</div>`
             :(gOf(s.no)?`<div class="gp">${gOf(s.no)}</div>`:''))+
      (!grouping&&td?`<div class="today">+${td}</div>`:'')+
      `<div class="no">${s.no}</div>`+
      (grouping
        ? `<div class="sc${sel.has(s.no)?'':' zero'}">${sel.has(s.no)?'✓':'·'}</div>`
        : `<div class="sc${t?'':' zero'}">${t}</div>`)+
      `<div class="nm">${s.name||''}</div>`;
    let hold=null,held=false;
    const startHold=()=>{held=false;hold=setTimeout(()=>{held=true;buzz(18);openHistory(s.no)},480)};
    const endHold=()=>clearTimeout(hold);
    el.addEventListener('touchstart',startHold,{passive:true});
    el.addEventListener('touchend',endHold);
    el.addEventListener('touchmove',endHold,{passive:true});
    el.addEventListener('mousedown',startHold);
    el.addEventListener('mouseup',endHold);
    el.addEventListener('mouseleave',endHold);
    el.onclick=()=>{
      if(held){held=false;return}
      if(grouping){sel.has(s.no)?sel.delete(s.no):sel.add(s.no);buzz(10);render();}
      else openItems([s.no]);
    };
    grid.appendChild(el);
  });

  const bb=$('#bottom');
  bb.className=grouping?'grouping':'';
  bb.innerHTML=grouping
    ? `<button id="gClear">🧹 清除分組</button>
       <button id="gSet" class="set">✓ 設為第 ${nextGroupNo()} 組（${sel.size}）</button>
       <button id="gDone">完成</button>`
    : `<button id="btnBoard">🏆 本節</button>
       <button id="btnMode" class="pri">👥 整組</button>
       ${missionsOf()? '<button id="btnQuest">🚁 闖關</button>'
                     : '<button id="btnCalc">📊 成績</button>'}`;
  wireBottom();
  save();
}

/* ---------------- 加分 ---------------- */
function openItems(nos,gLabel){
  const c=course();
  const many=nos.length>1;
  const items=c.items.filter(i=>many? true : !i.group);
  sheet(`
    <h3>${gLabel||('座號 '+nos[0]+(roster(D.cur.cls).find(s=>s.no===nos[0])?.name?' · '+roster(D.cur.cls).find(s=>s.no===nos[0]).name:''))}
    <span>${c.icon} ${c.name} · ${D.cur.cls}</span></h3>
    <div class="items">${items.map(i=>
      `<button data-i="${i.id}" class="${i.v<0?'neg':''}">${i.icon} ${i.name}
       <small>${tagName(i.tag,c)} ${i.v>0?'+':''}${i.v}</small></button>`).join('')}</div>
    <div class="closebar"><button data-close>取消</button></div>
  `,el=>{
    el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
      const it=c.items.find(x=>x.id===b.dataset.i);
      const k=sessionKey(),t=Date.now();
      const rst=roster(D.cur.cls);
      nos.forEach(no=>D.records.push({t,session:k,course:c.id,cls:D.cur.cls,no,
        g:gOf(no)||0,
        item:it.id,name:it.name,tag:it.tag,v:it.v}));
      buzz(it.v<0?[18,40,18]:22);scheduleSync();
      toast(`${it.icon} ${it.name} ${it.v>0?'+':''}${it.v}${many?' × '+nos.length+' 人':''}`,it.v<0);
      close();render();
    });
  });
}

/* ---------------- 雲端同步（背景，不擋操作） ----------------
   設計原則：按下去先寫本機，同步是之後的事。同步失敗就留在佇列，
   下次有網路自己補送。網址只存在這台手機，不進程式碼。 */
let syncing=false;
function pending(){return D.records.filter(r=>!r.sy).length}

async function flushSync(silent){
  const url=D.sync&&D.sync.url;
  if(!url){if(!silent)toast('還沒設定同步網址',1);return}
  if(syncing)return;
  const todo=D.records.filter(r=>!r.sy);
  if(!todo.length){if(!silent)toast('已經全部同步了');return}
  syncing=true;
  try{
    const rows=todo.map(r=>{
      const c=D.courses.find(x=>x.id===r.course);
      const s=(D.rosters[r.cls]||[]).find(x=>x.no===r.no)||{};
      return [new Date(r.t).toISOString(), c?c.name:r.course, r.cls, r.no,
              s.name||'', s.from||'', r.name, tagName(r.tag,c), r.v, r.g||'', r.t];
    });
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({rows})});
    const out=await res.json();
    if(!out||out.ok!==true)throw new Error(out&&out.error||'伺服器沒說 ok');
    todo.forEach(r=>r.sy=1);
    D.sync.lastAt=Date.now();
    save();
    if(!silent)toast(`已同步 ${rows.length} 筆`);
  }catch(e){
    if(!silent)toast('同步失敗：'+String(e.message||e).slice(0,30),1);
  }finally{syncing=false;render()}
}
/* 加分後延遲送出，避免連點時一直打網路 */
let syncTimer=null;
function scheduleSync(){
  if(!(D.sync&&D.sync.url))return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>flushSync(true),8000);
}

/* 名冊與分組上雲：整批覆寫 Students / Groups 兩張表，不碰加分記錄 */
async function uploadRoster(){
  const url=D.sync&&D.sync.url;
  if(!url){toast('先設定同步網址',1);return}
  toast('上傳中…');
  const students=[],groups=[];
  Object.entries(D.rosters).forEach(([cls,list])=>{
    list.forEach(s=>{
      if(!s.name)return;                       // 空號（轉學）不上傳
      students.push([`${cls}-${String(s.no).padStart(2,'0')}`,cls,s.no,
                     s.name,'',true,s.from||'']);
    });
  });
  const now=new Date().toISOString();
  Object.entries(D.groups||{}).forEach(([cid,byCls])=>{
    const c=D.courses.find(x=>x.id===cid);
    Object.entries(byCls).forEach(([cls,m])=>{
      const size={};
      Object.values(m).forEach(g=>{if(g)size[g]=(size[g]||0)+1});
      Object.entries(m).forEach(([no,g])=>{
        if(!g)return;
        groups.push([cid,c?c.name:cid,cls,g,+no,
                     `${cls}-${String(no).padStart(2,'0')}`,
                     size[g], size[g]>=3&&size[g]<=4, now]);
      });
    });
  });
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({students,groups})});
    const out=await res.json();
    if(!out||out.ok!==true)throw new Error(out&&out.error||'伺服器沒說 ok');
    if(out.students===undefined)throw new Error('Apps Script 還是舊版，要重新部署');
    D.sync.rosterAt=Date.now();save();
    toast(`已上傳 ${out.students} 人、${out.groups} 筆分組`);
  }catch(e){toast('上傳失敗：'+String(e.message||e).slice(0,30),1)}
}

/* ---------------- 闖關頁 ---------------- */
function missionsOf(c){ return (c||course()).missions || null; }
function planOf(){                       // 已開放到第幾關
  D.plan=D.plan||{};
  const c=D.cur.course,k=D.cur.cls;
  D.plan[c]=D.plan[c]||{}; D.plan[c][k]=D.plan[c][k]||{openTo:1};
  return D.plan[c][k];
}
function progOf(){                       // 各關各組狀態
  D.prog=D.prog||{};
  const c=D.cur.course,k=D.cur.cls;
  D.prog[c]=D.prog[c]||{}; D.prog[c][k]=D.prog[c][k]||{};
  return D.prog[c][k];
}
function groupsHere(){
  const m=gmap(),by={};
  Object.entries(m).forEach(([no,g])=>{if(g)(by[g]=by[g]||[]).push(+no)});
  return Object.keys(by).sort((a,b)=>a-b).map(g=>({g:+g,seats:by[g].sort((a,b)=>a-b)}));
}
function stOf(mid,g){ return (progOf()[mid]||{})[g] || 'none'; }
function setSt(mid,g,s){
  const p=progOf(); p[mid]=p[mid]||{};
  if(s==='none')delete p[mid][g]; else p[mid][g]=s;
  save();
}

/* 圓環：單一數列，中央直接標數字，不靠顏色分辨 */
function donut(pass,total,size){
  const r=size/2-7, c=size/2, C=2*Math.PI*r;
  const pct=total?pass/total:0;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img"
      aria-label="${total} 組中 ${pass} 組通過">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#3a3a3c" stroke-width="9"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${ST.pass.c}" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}"
      transform="rotate(-90 ${c} ${c})"/>
    <text x="${c}" y="${c-2}" text-anchor="middle" fill="#fff"
      font-size="${size*0.26}" font-weight="800">${pass}</text>
    <text x="${c}" y="${c+size*0.18}" text-anchor="middle" fill="#8e8e93"
      font-size="${size*0.13}" font-weight="600">/ ${total} 組</text>
  </svg>`;
}

function openQuest(){
  const c=course(), ms=missionsOf(c);
  if(!ms){toast('這門課還沒有闖關任務',1);return}
  const plan=planOf(), gs=groupsHere();
  if(!gs.length){toast('這個班還沒分組，⚙️ → 快速分組',1);return}

  const cur=ms.find(m=>m.seq===plan.openTo)||ms[0];
  const tally={pass:0,sub:0,revise:0,none:0};
  gs.forEach(x=>tally[stOf(cur.id,x.g)]++);

  sheet(`<h3>🚁 ${c.name} · ${D.cur.cls}
      <span>第 ${cur.seq} 關　${cur.title}${cur.gate?`　🔑 ${cur.gate} 關卡`:''}</span></h3>

    <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">
      ${donut(tally.pass,gs.length,104)}
      <div style="flex:1;font-size:14px;line-height:2">
        ${Object.entries(tally).filter(([k,v])=>v).map(([k,v])=>
          `<div><span style="display:inline-block;width:11px;height:11px;border-radius:3px;
            background:${ST[k].c};margin-right:7px;vertical-align:-1px"></span>
            ${ST[k].i} ${ST[k].t} <b>${v}</b> 組</div>`).join('') || '<div style="color:var(--dim)">還沒有記錄</div>'}
      </div>
    </div>

    ${gs.map(x=>{
      const s=stOf(cur.id,x.g), d=ST[s];
      const w=s==='pass'?100:s==='sub'?66:s==='revise'?40:6;
      return `<div class="row" data-g="${x.g}" style="cursor:pointer">
        <b style="flex:none;width:52px">第${x.g}組</b>
        <div style="flex:1;height:10px;background:#3a3a3c;border-radius:5px;overflow:hidden">
          <div style="width:${w}%;height:100%;background:${d.c};border-radius:5px"></div>
        </div>
        <span style="flex:none;width:74px;text-align:right;font-size:13px;color:${d.c};font-weight:700">
          ${d.i} ${d.t}</span>
      </div>`;
    }).join('')}
    <div style="color:var(--dim);font-size:12px;margin-top:2px">點組別可切換狀態</div>

    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn gray" data-prev style="margin:0">◀ 上一關</button>
      <button class="btn" data-next style="margin:0">下一關 ▶</button>
    </div>
    <button class="btn gray" data-care>🩺 關懷清單</button>
    <div class="closebar"><button data-close>關閉</button></div>`,el=>{

    el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
      const g=+b.dataset.g, order=['none','sub','revise','pass'];
      const now=stOf(cur.id,g);
      const next=order[(order.indexOf(now)+1)%order.length];
      // 安全關卡不可跳過待核准直接通過
      if(cur.gate && now==='none' && next!=='sub'){setSt(cur.id,g,'sub')}
      else setSt(cur.id,g,next);
      buzz(12); close(); openQuest();
    });
    el.querySelector('[data-prev]').onclick=()=>{
      plan.openTo=Math.max(1,plan.openTo-1);save();close();openQuest();
    };
    el.querySelector('[data-next]').onclick=()=>{
      plan.openTo=Math.min(ms.length,plan.openTo+1);save();close();openQuest();
      toast(`已開放第 ${plan.openTo} 關`);
    };
    el.querySelector('[data-care]').onclick=()=>{close();openCare()};
  });
}

/* 關懷清單：跨關卡掃描，找出落後與異常 */
function openCare(){
  const c=course(), ms=missionsOf(c);
  const plan=planOf(), gs=groupsHere(), items=[];

  gs.forEach(x=>{
    if(x.seats.length<3) items.push({p:1,t:`第${x.g}組只有 ${x.seats.length} 人`,d:'少於三人'});
    if(x.seats.length>4) items.push({p:1,t:`第${x.g}組有 ${x.seats.length} 人`,d:'超過四人'});
    let miss=0;
    ms.filter(m=>m.seq<=plan.openTo).forEach(m=>{
      const s=stOf(m.id,x.g);
      if(s==='pass'){miss=0;return}
      if(s==='none')miss++;
      if(m.gate&&s!=='pass')
        items.push({p:0,t:`第${x.g}組 ${m.gate} 關卡未通過`,d:`${m.id} ${m.title}`});
    });
    if(miss>=2) items.push({p:1,t:`第${x.g}組連續 ${miss} 關未完成`,d:'需要關心'});
  });

  const r=roster(D.cur.cls), m=gmap();
  r.forEach(s=>{ if(s.name&&!m[s.no]) items.push({p:1,t:`${s.no} ${s.name} 沒有組別`,d:'未分組'}); });

  items.sort((a,b)=>a.p-b.p);
  sheet(`<h3>🩺 關懷清單<span>${c.name} · ${D.cur.cls}　共 ${items.length} 件</span></h3>
    ${items.length? items.map(i=>`<div class="row">
        <span style="flex:none">${i.p===0?'🔴':'🟡'}</span>
        <b>${i.t}</b><span class="tag">${i.d}</span></div>`).join('')
      : `<div class="empty">目前沒有需要關心的項目 👏</div>`}
    <div class="closebar"><button data-close>關閉</button></div>`);
}

/* 刪一筆記錄：本機刪掉，若已同步就通知雲端一起刪 */
async function delRecord(rec){
  D.records=D.records.filter(r=>!(r.t===rec.t&&r.no===rec.no&&r.item===rec.item));
  save();render();
  buzz([12,30,12]);
  const url=D.sync&&D.sync.url;
  if(rec.sy&&url){
    try{
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({del:[[rec.t,rec.no,rec.name]]})});
      const out=await res.json();
      // 舊版 Apps Script 不認得刪除指令，會回 ok 但沒 deleted → 不可當成功
      if(out&&out.ok&&typeof out.deleted==='number')
        toast(out.deleted?'已刪除（含雲端）':'本機已刪，雲端找不到那筆');
      else toast('本機已刪，雲端沒刪掉（Apps Script 要更新）',1);
    }catch(e){toast('本機已刪，雲端沒連上',1)}
  }else toast('已刪除');
}

function undo(){
  if(!D.records.length){toast('沒有可以撤銷的',1);return}
  const last=D.records[D.records.length-1];
  const batch=D.records.filter(r=>r.t===last.t);
  D.records=D.records.filter(r=>r.t!==last.t);
  buzz([12,30,12]);toast(`已撤銷 ${last.name} × ${batch.length}`,1);
  save();render();
}

function exportCSV(all){
  const rows=[['時間','課程','班級','座號','姓名','項目','歸類','分值']];
  D.records.filter(r=>all||(r.course===D.cur.course&&r.cls===D.cur.cls)).forEach(r=>{
    const cn=D.courses.find(c=>c.id===r.course)?.name||r.course;
    const nm=(D.rosters[r.cls]||[]).find(s=>s.no===r.no)?.name||'';
    rows.push([new Date(r.t).toLocaleString('zh-TW'),cn,r.cls,r.no,nm,r.name,tagName(r.tag,D.courses.find(c=>c.id===r.course)),r.v]);
  });
  const csv='﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const b=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=`計分_${all?'全部':D.cur.cls}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('已匯出 '+(rows.length-1)+' 筆');
}

async function checkUpdate(){
  toast('查詢中…');
  try{
    const r=await fetch(location.href.split('?')[0]+'?cb='+Date.now(),{cache:'no-store'});
    const t=await r.text();
    const m=t.match(/const VERSION='([^']+)'/), b=t.match(/const BUILT='([^']+)'/);
    if(!m)throw new Error('讀不到線上版本');
    if(m[1]===VERSION){toast(`已是最新 v${VERSION}`);return}
    if(!confirm(`線上有新版 v${m[1]}（${b?b[1]:''}），現在更新？\n你的資料不會受影響。`))return;
    const regs=await navigator.serviceWorker.getRegistrations();
    for(const g of regs)await g.unregister();
    for(const k of await caches.keys())await caches.delete(k);
    location.replace(location.href.split('?')[0]+'?v='+Date.now());
  }catch(e){toast('查不到：'+String(e.message||e).slice(0,26),1)}
}

  sheet(`<h3>⚙️ 設定<span>手機 v${VERSION}　${BUILT}　｜　${sameVer}</span></h3>

function setupCourses(){
  sheet(`<h3>📚 課程與班級</h3>
    ${D.courses.map(c=>`<div class="row"><span style="font-size:19px">${c.icon}</span>
      <b>${c.name}</b><span class="tag">${c.classes.join(' ')}</span></div>`).join('')}

        const icon=parts.length>1?parts[0]:'📘';
        const name=(parts.length>1?parts.slice(1).join(' '):parts[0]).trim();
        const old=D.courses.find(c=>c.name===name);
        return {id:old?old.id:'c'+id(),name,icon,
          classes:(right||'').split(',').map(s=>s.trim()).filter(Boolean),
          items:old?old.items:defaultItems(),
          tagNames:old?old.tagNames:undefined};
      }).filter(c=>c.name&&c.classes.length);
      if(!next.length)return toast('格式怪怪的',1);
      D.courses=next;
      if(!D.courses.find(c=>c.id===D.cur.course))D.cur={course:D.courses[0].id,cls:D.courses[0].classes[0]};

/* 純文字名單：一行班級代號，接著「座號 姓名」或「座號 姓名 原班-座號」
   例：
     801
     1 林宏峻
     2 林建志
   貼到一半斷掉也只影響最後那個班，不會整包失敗 */
function parsePlain(txt){
  const out={};let cur=null;
  txt.split('\n').forEach(ln=>{
    const s=ln.trim();if(!s)return;
    if(/^[A-Za-z0-9一-龥]{2,6}$/.test(s)&&!/^\d+\s/.test(s)&&!/^\d+$/.test(s)){
      cur=s;out[cur]=out[cur]||[];return;
    }
    const m=s.match(/^(\d+)[\s.、]+(\S+)(?:\s+(\S+))?$/);
    if(m&&cur)out[cur].push({no:+m[1],name:m[2],from:m[3]||''});
  });
  if(!Object.keys(out).length)throw new Error('沒讀到任何班級');
  return out;
}

function setupData(){
  sheet(`<h3>💾 資料</h3>
    <div class="row"><b>目前記錄</b><span>${D.records.length} 筆</span></div>
    <div class="row"><b>班級數</b><span>${new Set(D.courses.flatMap(c=>c.classes)).size}</span></div>
    <button class="btn" data-bk>⬇️ 下載完整備份（JSON）</button>
    <label>貼上名單（純文字或 JSON 都行）</label>
    <textarea id="rs" rows="5" placeholder="801&#10;1 林宏峻&#10;2 林建志&#10;&#10;802&#10;1 江秉恩"></textarea>
    <button class="btn" data-imp>👥 只匯入名單（不動計分）</button>
    <button class="btn gray" data-rs>♻️ 完整還原（會覆蓋全部）</button>
    <button class="btn danger" data-clr>⚠️ 清空所有計分記錄</button>
    <div class="closebar"><button data-close>關閉</button></div>`,el=>{
    el.querySelector('[data-bk]').onclick=()=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));
      a.download=`計分備份_${new Date().toISOString().slice(0,10)}.json`;a.click();toast('已下載');
    };
    el.querySelector('[data-imp]').onclick=()=>{
      try{
        const raw=el.querySelector('#rs').value.trim();
        let o=raw.startsWith('{')?JSON.parse(raw):parsePlain(raw);
        let nc=0;
        // 一併帶課程時，同名課程只更新班級與四項名稱，保留既有項目與計分設定
        if(Array.isArray(o.courses)){
          o.courses.forEach(nx=>{
            const old=D.courses.find(x=>x.name===nx.name);
            if(old){ old.icon=nx.icon||old.icon; old.classes=nx.classes||old.classes;
                     if(nx.tagNames)old.tagNames=nx.tagNames; }
            else D.courses.push({id:'c'+id(),name:nx.name,icon:nx.icon||'📘',
                   classes:nx.classes||[],items:defaultItems(),tagNames:nx.tagNames});
            nc++;
          });
          if(!D.courses.find(x=>x.id===D.cur.course))
            D.cur={course:D.courses[0].id,cls:D.courses[0].classes[0]};
        }
        if(o.rosters)o=o.rosters; else if(o.courses)o={...o,courses:undefined};
        let n=0;
        Object.entries(o).forEach(([cls,list])=>{
          if(!Array.isArray(list))return;
          const old=D.rosters[cls]||[];
          // 依座號對位：有缺號也不會整排位移，缺的位子留空
          const byNo=new Map();
          list.forEach((s,i)=>{
            const no=Number(s.no)||i+1;
            byNo.set(no,typeof s==='string'?s:(s.name||'').trim());
          });
          const max=Math.max(...byNo.keys());
          const fromNo=new Map();
          list.forEach((s,i)=>{if(s&&s.from)fromNo.set(Number(s.no)||i+1,String(s.from))});
          D.rosters[cls]=Array.from({length:max},(_,i)=>({
            no:i+1,
            name:byNo.get(i+1)||'',
            from:fromNo.get(i+1)||old.find(x=>x.no===i+1)?.from||'',
            group:0
          }));
          n++;
        });
        if(!n&&!nc)throw 0;
        save();close();render();
        toast(`已匯入 ${n} 個班級${nc?`、${nc} 個課程`:''}`);
      }catch(e){toast('讀不到名單：'+(e.message||'格式怪怪的').slice(0,40),1)}
    };
    el.querySelector('[data-rs]').onclick=()=>{
      try{const o=JSON.parse(el.querySelector('#rs').value);
        if(!o.courses)throw 0;D={...structuredClone(DEFAULT),...o};save();close();render();toast('已還原');
      }catch(e){toast('內容看起來不是備份檔',1)}
    };
    el.querySelector('[data-clr]').onclick=()=>{
      if(!confirm('確定清空全部計分記錄？名單和項目會保留。'))return;
      D.records=[];save();close();render();toast('已清空',1);
    };
  });
}

let sheetEl=null;

  close();
  sheetEl=document.createElement('div');
  sheetEl.className='sheet';
  sheetEl.innerHTML='<div>'+html+'</div>';
  sheetEl.onclick=e=>{if(e.target===sheetEl)close()};
  sheetEl.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  document.body.appendChild(sheetEl);
  after&&after(sheetEl);
}
